# Global tools and host packages, on every machine. Plain (not a template) so
# `mise use -g <tool>` and `mise bootstrap packages use <pkg>` can write here
# and `chezmoi re-add` can pick the change back up - chezmoi refuses to
# overwrite templates. Machine-conditional entries live in conf.d/, which mise
# merges into this file; .chezmoiignore decides which of those land.

[tools]
# Shell / core CLI
bat = "latest"
eza = "latest"
fzf = "latest"
ripgrep = "latest"
starship = "latest"
carapace = "latest"
jq = "latest"
yq = "latest"
cloc = "latest"
uv = "latest"
java = "zulu-21"
just = "latest"
act = "latest"
prek = "latest"
github-cli = "latest"
gitleaks = "latest"
git-lfs = "latest"
jj = "latest"

# Cloud / data
azure = "latest"
azd = "latest"

# Agents
claude = "latest"
codex = "latest"
opencode = "latest"
apm = "latest"

topgrade = "latest"
# mise-managed python: venv-based backends (pipx:*) need a configured python
# or they fall back to the system python (3.9 on a clean mac), which is too old.
python = "3.13"

# Host packages: system libraries and base tools. Not shimmed, not
# version-pinned per-project. Entries whose manager is unavailable on the
# current host are ignored, so one list serves both macOS and Arch.
# GUI apps live in ~/.config/homebrew/. Apply with: mise bootstrap packages apply

[bootstrap.packages]

# Base system tools
"brew:bash" = { os = "macos" }
"pacman:bash" = { os = "linux" }
"brew:git" = { os = "macos" }
"pacman:git" = { os = "linux" }
"brew:hashcat" = { os = "macos" }
"pacman:hashcat" = { os = "linux" }
"brew:tree" = { os = "macos" }
"pacman:tree" = { os = "linux" }
"brew:wget" = { os = "macos" }
"pacman:wget" = { os = "linux" }
"brew:watch" = { os = "macos" }
"pacman:procps-ng" = { os = "linux" }    # Arch ships watch here

# Shell integration
"brew:zsh-autosuggestions" = { os = "macos" }
"pacman:zsh-autosuggestions" = { os = "linux" }
"brew:zsh-syntax-highlighting" = { os = "macos" }
"pacman:zsh-syntax-highlighting" = { os = "linux" }

# chezmoi manages this config, so it cannot install itself on a bare machine -
# bootstrap with get.chezmoi.io. Declared here so it stays updated afterwards.
"brew:chezmoi" = { os = "macos" }
"pacman:chezmoi" = { os = "linux" }

[bootstrap.macos.trackpad]
tap_to_click = true
